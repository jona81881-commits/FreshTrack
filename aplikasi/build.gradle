plugins {
    id 'com.android.application'
}

android {
    namespace 'com.freshtrack.aplikasi'
    compileSdk 34

    defaultConfig {
        applicationId "com.freshtrack.aplikasi"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main {
            manifest.srcFile 'sumber/utama/AndroidManifest.xml'
            java.srcDirs = ['sumber/utama/java']
            res.srcDirs = ['sumber/utama/res']
            assets.srcDirs = ['sumber/utama/aset']
        }
        test {
            java.srcDirs = ['sumber/pengujian']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core:1.12.0'
}

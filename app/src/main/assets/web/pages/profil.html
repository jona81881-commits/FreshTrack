<!-- FreshTrack: Halaman Profil & Pengaturan -->
<div class="header-bar">
  <span class="header-title">Profil & Pengaturan</span>
</div>

<div style="padding: 16px 20px;">
  <!-- User Info Card -->
  <div style="background: var(--white); border-radius: var(--radius-lg); padding: 18px 20px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 16px; margin-bottom: 20px; box-shadow: var(--shadow-sm);">
    <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--light-blue-soft); color: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0;">
      BS
    </div>
    <div>
      <div style="font-size: 16px; font-weight: 700; color: var(--text-primary);" id="profile-user-name">Budi Santoso</div>
      <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;" id="profile-user-email">budi.santoso@email.com</div>
    </div>
  </div>

  <!-- Settings Group -->
  <div style="background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 6px 16px; margin-bottom: 20px; box-shadow: var(--shadow-sm);">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color);">
      <div>
        <div style="font-size: 14px; font-weight: 600;">Waktu Alarm Bawaan</div>
        <div style="font-size: 11px; color: var(--text-secondary);">Jam pengingat otomatis dikirim</div>
      </div>
      <input type="time" id="profile-alarm-time" value="20:00" style="padding: 6px; border: 1px solid var(--border-color); border-radius: 6px; font-weight: 600; color: var(--primary-color);" onchange="ProfilePage.updateSetting('default_alarm_time', this.value)">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color);">
      <div>
        <div style="font-size: 14px; font-weight: 600;">Suara Notifikasi</div>
        <div style="font-size: 11px; color: var(--text-secondary);">Bunyikan nada saat alarm tiba</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="profile-switch-sound" checked onchange="ProfilePage.updateSetting('sound_enabled', this.checked)">
        <span class="slider"></span>
      </label>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0;">
      <div>
        <div style="font-size: 14px; font-weight: 600;">Getaran</div>
        <div style="font-size: 11px; color: var(--text-secondary);">Getarkan perangkat saat alarm tiba</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="profile-switch-vibration" checked onchange="ProfilePage.updateSetting('vibration_enabled', this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- About & Help Group -->
  <div style="background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 4px 16px; margin-bottom: 24px; box-shadow: var(--shadow-sm);">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer;" onclick="ProfilePage.showHelpModal()">
      <span style="font-size: 14px; font-weight: 500;">Bantuan & Panduan</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" color="var(--text-muted)"><path d="m9 18 6-6-6-6"/></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer;" onclick="ProfilePage.showPrivacyModal()">
      <span style="font-size: 14px; font-weight: 500;">Kebijakan Privasi</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" color="var(--text-muted)"><path d="m9 18 6-6-6-6"/></svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; cursor: pointer;" onclick="ProfilePage.showAboutModal()">
      <span style="font-size: 14px; font-weight: 500;">Tentang FreshTrack</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" color="var(--text-muted)"><path d="m9 18 6-6-6-6"/></svg>
    </div>
  </div>

  <button class="btn btn-outline btn-block btn-pill" onclick="ProfilePage.logout()" style="color: var(--status-red); border-color: #FED7D7; padding: 12px;">
    Keluar
  </button>
</div>
